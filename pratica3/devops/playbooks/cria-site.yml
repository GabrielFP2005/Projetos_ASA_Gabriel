---
- name: Configura um site estático.
  hosts: app
  become: true

  vars:
    apache_name_serv:
      "Debian": apache2
      "RedHat": httpd

  handlers:
    - name: restart apache
      service:
        name: "{{ apache_name_serv[ansible_os_family] }}"
        state: restarted

  tasks:
    - name: Instala o apache.
      package:
        name: "{{ apache_name_serv[ansible_os_family] }}"
        update_cache: yes
        state: present

    - name: Copia o html do site.
      copy:
        src: gabriel.html
        dest: "/var/www/html/index.html"
        mode: 0664
      notify: restart apache

    - name: Habilita o serviço do apache.
      service:
        name: "{{ apache_name_serv[ansible_os_family] }}"
        enabled: yes

    - name: Ajusta a página de código do apache para UTF-8
      lineinfile:
        dest: "/etc/{{apache_name_serv[ansible_os_family]}}/conf-enabled/charset.conf" 
        regexp: "^AddDefaultCharset"
        line: "AddDefaultCharset UTF-8"
        state: present
      notify: restart apache
