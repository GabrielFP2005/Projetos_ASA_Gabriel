---
- name: Instala e configura servidores dns e dhcp.
  hosts: dns
  become: true

  handlers:
  - name: restart bind
    service:
      name: bind9
      state: restarted
  
  - name: restart dhcp
    service:
      name: isc-dhcp-server
      state: restarted

  tasks:
    - name: Instala o servidor bind9.
      package:
      name: bind9
      update-cache: yes
      state: present

    - name: Instala o pacote bind9utils.
      package:
        name: bind9utils
        update-cache: yes
        state: present

    - name: Copia o arquivo de configuração named.conf.options.
      copy:
        src: "named.conf.options"
        dest: "/etc/bind/named.conf.options"
        mode: 0664
      notify: restart bind

    - name: Copia o arquivo de configuração named.conf.internal-zones.
      copy:
        src: "named.conf.internal-zones"
        dest: "/etc/bind/named.conf.internal-zones"
        mode: 0664
      notify: restart bind

    - name: Copia o arquivo de zona direta do DNS seunome.devops.db.
      copy:
        src: "gabrielpalmeira.devops.db"
        dest: "/etc/bind/gabrielpalmeira.devops.db"
        mode: 0664
      notify: restart bind

    - name: Copia o arquivo de zona reversa do DNS 56.168.192.db.
      copy:
        src: "56.168.192.db"
        dest: "/etc/bind/56.168.192.db"
        mode: 0664
      notify: restart bind

    - name: Ajusta a configuração default do bind9 para incluir zonas internas.
      lineinfile:
        dest: "/etc/bind/named.conf"
        line: 'include "/etc/bind/named.conf.internal-zones";'
        state: present
      notify: restart bind

    - name: Instala o servidor dhcp.
      package:
        name: isc-dhcp-server
        update-cache: yes
        state: present
    
    - name: Copia o arquivo de configuração dhcp.
      copy:
        src: "dhcpd.conf"
        dest: "/etc/dhcp/dhcpd.conf"
        mode: 0664
      notify: restart dhcp

    - name: Habilita o serviço do dhcp.
      service:
        name: isc-dhcp-server
        enabled: yes

    - name: Ajusta a configuração default do dhcp.
      lineinfile:
        dest: "/etc/default/isc-dhcp-server"
        regexp: "^INTERFACESv4"
        line: 'INTERFACESv4="eth1"'
        state: present
      notify: restart dhcp
